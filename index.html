<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>P3TO STORE | Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f0d 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* animasi background glow */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.08) 0%, transparent 60%);
            animation: pulseGlow 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* grid pattern halus */
        body::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* icon animasi */
        .icon-wrapper {
            margin-bottom: 2rem;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .icon {
            font-size: 5rem;
            filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.4));
        }

        /* teks utama */
        .main-text {
            font-size: clamp(1.8rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #10b981 40%, #34d399 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s linear infinite;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* teks secondary */
        .sub-text {
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
            word-spacing: 0.3em;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #10b981, #34d399, #10b981, transparent);
            margin: 2rem auto 0;
            animation: expandWidth 1.5s ease-out;
        }

        @keyframes expandWidth {
            from { width: 0; opacity: 0; }
            to { width: 80px; opacity: 1; }
        }

        /* decorative dots */
        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #10b981;
            border-radius: 50%;
            opacity: 0.4;
            animation: blinkDot 2s infinite;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* floating particles */
        .particle {
            position: absolute;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 12s infinite ease-in-out;
            z-index: 0;
        }

        @keyframes floatParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.3; }
            100% { transform: translate(var(--tx, 100px), var(--ty, -100px)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- decorative dots -->
    <div class="dot" style="top: 15%; left: 10%;"></div>
    <div class="dot" style="top: 25%; right: 15%; animation-delay: 0.5s;"></div>
    <div class="dot" style="bottom: 20%; left: 20%; animation-delay: 1s;"></div>
    <div class="dot" style="bottom: 35%; right: 25%; animation-delay: 0.3s;"></div>
    <div class="dot" style="top: 50%; left: 5%; animation-delay: 0.8s;"></div>
    <div class="dot" style="top: 70%; right: 8%; animation-delay: 1.2s;"></div>

    <!-- floating particles -->
    <div class="particle" style="width: 150px; height: 150px; top: -50px; left: -50px; --tx: 200px; --ty: 150px; animation-duration: 15s;"></div>
    <div class="particle" style="width: 100px; height: 100px; bottom: -30px; right: -30px; --tx: -150px; --ty: -100px; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="particle" style="width: 200px; height: 200px; top: 40%; right: -80px; --tx: -250px; --ty: 50px; animation-duration: 18s; animation-delay: 4s;"></div>
    <div class="particle" style="width: 80px; height: 80px; bottom: 20%; left: -40px; --tx: 180px; --ty: -80px; animation-duration: 10s; animation-delay: 1s;"></div>

    <div class="container">
        <div class="icon-wrapper">
            <div class="icon">🔧</div>
        </div>
        
        <div class="main-text">
            Custom Banner<br>Sedang Ditutup Sementara!
        </div>
        
        <div class="sub-text">
            ⚡ Maaf atas ketidaknyamanannya ⚡
        </div>
        
        <div class="divider"></div>
    </div>

    <script>
        // tambahan efek random untuk particle bergerak
        document.addEventListener('DOMContentLoaded', function() {
            const particles = document.querySelectorAll('.particle');
            particles.forEach(particle => {
                const randomX = (Math.random() - 0.5) * 400;
                const randomY = (Math.random() - 0.5) * 300;
                particle.style.setProperty('--tx', randomX + 'px');
                particle.style.setProperty('--ty', randomY + 'px');
            });
        });
    </script>
</body>
</html>
